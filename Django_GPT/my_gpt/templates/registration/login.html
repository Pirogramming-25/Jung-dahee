{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로그인 - Django_GPT</title>
<link rel="stylesheet" href="{% static 'my_gpt/css/style.css' %}">
</head>
<body>
<main class="content login-content">
  <h1>로그인</h1>
  <p class="model-meta">Django_GPT의 로그인 필요 기능을 사용하려면 로그인해주세요.</p>

  {% if form.errors %}
    <p class="error-box">아이디 또는 비밀번호가 올바르지 않습니다.</p>
  {% endif %}

  <form method="post" class="stacked-form">
    {% csrf_token %}
    <label for="id_username">아이디</label>
    {{ form.username }}
    <label for="id_password">비밀번호</label>
    {{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="primary-button">로그인</button>
  </form>

  <p><a class="to-sentiment" href="{% url 'sentiment_page' %}">← 감정 분석(비로그인) 페이지로 돌아가기</a></p>
</main>

{% if request.GET.required == "1" %}
<script>
  alert("로그인 후 이용해주세요");
</script>
{% endif %}
</body>
</html>
