{% extends 'base.html' %}
{% block title %}회원가입{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Pirostagram</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">가입하기</button>
    </form>
    <div class="form-footer">
        이미 계정이 있으신가요? <a href="{% url 'accounts:login' %}">로그인</a>
    </div>
</div>
{% endblock %}
