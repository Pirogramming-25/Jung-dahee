{% extends 'base.html' %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Pirostagram</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.username }}
        {{ form.password }}
        {{ form.errors }}
        <button type="submit">로그인</button>
    </form>
    <div class="form-footer">
        계정이 없으신가요? <a href="{% url 'accounts:signup' %}">가입하기</a>
    </div>
</div>
{% endblock %}
